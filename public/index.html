<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NM PDF - PDF Tools</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101010;
      color: #f5f5f5;
      text-align: center;
    }
    header {
      padding: 24px 15px;
      border-bottom: 1px solid #c9a227;
    }
    h1 { color: #d4af37; margin: 0; }
    .container {
      max-width: 650px;
      margin: 55px auto;
      padding: 25px;
    }
    .card {
      background: #1c1c1c;
      border: 1px solid #c9a227;
      border-radius: 14px;
      padding: 28px 20px;
    }
    h2 { color: #d4af37; }
    p { color: #ccc; line-height: 1.6; }
    input[type="file"] {
      width: 100%;
      margin: 20px 0;
      padding: 12px;
      background: #292929;
      color: white;
      border-radius: 6px;
    }
    button {
      background: #d4af37;
      color: #111;
      border: 0;
      padding: 13px 25px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #status { margin-top: 18px; }
    footer { color: #888; padding: 25px; }
  </style>
</head>
<body>
  <header>
    <h1>NM PDF</h1>
    <p>Simple PDF Tools</p>
  </header>

  <main class="container">
    <div class="card">
      <h2>PDF to Excel</h2>
      <p>Apni PDF file select karein aur Excel file mein convert karein.</p>

      <form id="convertForm">
        <input type="file" id="pdfFile" name="pdf"
               accept=".pdf,application/pdf" required>
        <button type="submit" id="convertBtn">Convert to Excel</button>
      </form>

      <p id="status"></p>
    </div>
  </main>

  <footer>© 2026 NM PDF</footer>

  <script>
    document.getElementById("convertForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const file = document.getElementById("pdfFile").files[0];
      const status = document.getElementById("status");
      const button = document.getElementById("convertBtn");

      if (!file) {
        status.textContent = "Please select a PDF file.";
        return;
      }

      const data = new FormData();
      data.append("pdf", file);
      button.disabled = true;
      status.textContent = "Converting... Please wait.";

      try {
        const response = await fetch("/api/pdf-to-excel", {
          method: "POST",
          body: data
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || "Conversion failed.");
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = file.name.replace(/\.pdf$/i, "") + ".xlsx";
        a.click();
        URL.revokeObjectURL(url);
        status.textContent = "Conversion successful!";
      } catch (error) {
        status.textContent = "Error: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
