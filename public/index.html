<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NM PDF — Professional PDF Tools</title>
<meta name="description" content="NM PDF — Your online workspace for PDF and document tools.">

<style>
:root {
  --bg: #090909;
  --panel: #141414;
  --gold: #d8ad55;
  --gold-light: #f5d990;
  --text: #f7f5ef;
  --muted: #a6a6a6;
  --border: rgba(216,173,85,.22);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.6;
}

button, input { font: inherit; }

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(1120px, 92%);
  margin: auto;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(9,9,9,.94);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}

.nav {
  min-height: 76px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: -1px;
}

.logo span { color: var(--gold); }

.nav-links {
  display: flex;
  align-items: center;
  gap: 26px;
  font-size: 14px;
  color: #d1d1d1;
}

.nav-links a:hover { color: var(--gold); }

.nav-button {
  padding: 10px 17px;
  background: var(--gold);
  color: #111;
  border-radius: 7px;
  font-weight: 700;
}

.hero {
  padding: 95px 0 75px;
  text-align: center;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(216,173,85,.13), transparent 58%);
}

.badge {
  display: inline-block;
  border: 1px solid var(--border);
  background: rgba(216,173,85,.07);
  color: var(--gold-light);
  border-radius: 30px;
  padding: 7px 15px;
  font-size: 12px;
  letter-spacing: 1.5px;
  margin-bottom: 24px;
}

.hero h1 {
  font-size: clamp(38px, 7vw, 70px);
  line-height: 1.08;
  letter-spacing: -2px;
  max-width: 850px;
  margin: 0 auto 22px;
}

.hero h1 span {
  color: var(--gold);
}

.hero p {
  max-width: 590px;
  margin: 0 auto;
  color: var(--muted);
  font-size: 17px;
}

.hero-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 13px;
  margin-top: 32px;
}

.btn {
  display: inline-block;
  border: 1px solid var(--gold);
  border-radius: 8px;
  padding: 13px 23px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s ease;
}

.btn-gold {
  background: var(--gold);
  color: #111;
}

.btn-outline {
  color: var(--gold-light);
  background: transparent;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(216,173,85,.15);
}

.trust {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 25px;
  margin-top: 34px;
  color: #bdbdbd;
  font-size: 13px;
}

.trust span::first-letter { color: var(--gold); }

.section {
  padding: 65px 0 85px;
}

.section-heading {
  text-align: center;
  margin-bottom: 38px;
}

.eyebrow {
  color: var(--gold);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.section-heading h2 {
  font-size: clamp(28px, 4vw, 42px);
  margin: 10px 0;
  letter-spacing: -1px;
}

.section-heading p {
  color: var(--muted);
}

.tools-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}

.tool-card {
  background: linear-gradient(145deg, #181818, #101010);
  border: 1px solid #292929;
  border-radius: 15px;
  padding: 25px;
  transition: .25s ease;
  min-width: 0;
}

.tool-card:hover {
  border-color: var(--gold);
  transform: translateY(-5px);
  box-shadow: 0 12px 35px rgba(0,0,0,.25);
}

.tool-icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border-radius: 12px;
  background: rgba(216,173,85,.1);
  border: 1px solid var(--border);
  color: var(--gold);
  font-size: 25px;
  margin-bottom: 20px;
}

.tool-card h3 {
  font-size: 19px;
  margin-bottom: 8px;
}

.tool-card p {
  color: var(--muted);
  font-size: 13px;
  min-height: 42px;
  margin-bottom: 21px;
}
